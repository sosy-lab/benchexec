    "LOG015",  # we always use the root logger
    "PIE790",  # arguably better readable if function contains "pass" instead of just docstring
    "TD002",  # missing-todo-author: we do not enforce strict todo-comment structure
    "TD003",  # missing-todo-link: we do not enforce strict todo-comment structurek
    "TD004",  # missing-todo-colon: we do not enforce strict todo-comment structuren
    # checks from ruff's default selection that should be worked on
    "B006",   # TODO
    "BLE001",  # TODO check each case, some are required
    "PLE0704",  # TODO check whether this works as it should
    "PLW1510",  # TODO
