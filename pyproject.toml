[tool.ruff.lint.per-file-ignores]
"benchexec/tools/*.py" = [
    "B019",  # caching of instance methods is not problematic here, we just have one long-lived instance
    "N999",  # we import these modules manually, names do not need to be valid Python
]
"contrib/p4/p4-test-tool.py" = ["N999"]  # same as above

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
python_files = ["test_*.py", "test_integration/__init__.py", "test.py"]
norecursedirs = ["contrib/p4/docker_files", "build", "benchexec/tablegenerator/react-table"]

[tool.codespell]
skip = 	"""\
        ./BenchExec.egg-info,\
		./benchexec/tablegenerator/react-table/build,\
		./benchexec/tablegenerator/react-table/node_modules,\
        ./benchexec/tablegenerator/test_integration/expected,\
		*.min.js,package-lock.json,*.snap,\
        ./pyproject.toml,\
        ./benchexec/tools/aprove.py,\
