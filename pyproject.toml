[project]
name = "BenchExec"
authors = [{name = "Dirk Beyer"}]
description = "A Framework for Reliable Benchmarking and Resource Measurement."
keywords = [
    "benchmarking",
    "resource measurement",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: ISC License (ISCL)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Benchmark",
]
license = {text = "Apache-2.0 AND BSD-3-Clause AND CC-BY-4.0 AND MIT AND ISC AND LicenseRef-BSD-3-Clause-CMU"}
requires-python = ">= 3.10"
dependencies = ["PyYAML >= 3.12"]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/sosy-lab/benchexec/"
Documentation = "https://github.com/sosy-lab/benchexec/blob/main/doc/INDEX.md"
Changelog = "https://github.com/sosy-lab/benchexec/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/sosy-lab/benchexec/issues"

[project.optional-dependencies]
dev = [
    "lxml",
    "pytest",
    # Duplicate info here from systemd extra:
    "pystemd >= 0.7.0; platform_system != 'Windows'",
]
systemd = ["pystemd >= 0.7.0; platform_system != 'Windows'"]

[project.scripts]
benchexec = "benchexec.benchexec:main"
containerexec = "benchexec.containerexecutor:main"
runexec = "benchexec.runexecutor:main"
table-generator = "benchexec.tablegenerator:main"

[build-system]
requires = [
    # Require versions that support our license files
    # and produce the expected file names or archives.
    'setuptools >= 69.3.0',
    'wheel >= 0.32.0',
]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
packages = ["benchexec", "benchexec.tablegenerator", "benchexec.tools"]
zip-safe = true
platforms = ["Linux"]
license-files = ["LICENSES/*.txt"]
include-package-data = false

[tool.setuptools.package-data]
"benchexec.tablegenerator" = [
    "react-table/build/*.min.js",
    "react-table/build/*.min.css",
]

[tool.setuptools.dynamic]
version = {attr = "benchexec.__version__"}

[tool.coverage.run]
branch = true
parallel = true
source = ['benchexec']
omit = ['benchexec/tools/*']

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    'pragma: no cover',

    # Don't complain about missing debug-only code:
    'def __repr__',
    'if self\.debug',

    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if 0:',
    'if __name__ == .__main__.:',
]

[tool.coverage.html]
directory = 'coverage'

[tool.pytype]
inputs = ['benchexec']
exclude = [
    'benchexec/tablegenerator/react-table',
    # TODO
    'benchexec/tools',
    '**/test_*.py',
    '**/test_*/**.py',
]

[tool.ruff]
line-length = 88
extend-include = ["bin/*"]
extend-exclude = [
    # code copied by build system
    "build",
    # Created locally by IDE plugins
    ".ropeproject",
    # scripts from JS modules
    "node_modules",
]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    #"C4", # flake8-comprehensions
    "E", # pycodestyle errors
    #"EXE", # flake8-executable
    "F", # pyflakes
    "G", # flake8-logging-format
    #"I", # isort
    "N", # pep8-naming
    "PGH", # pygrep-hooks
    #"PT", # Activate if migrated to pytest
    "R", # flake8-return
    "RUF101", # migrate to updated rulenames
    "S", # bandit
    "T10", # flake8-debugger
    "T20", # flake8-print
    "W", # pycodestyle warnings
]

ignore = [
    # temporarily disabled for historic reasons: line length, naming
    "E501",
    "N801",
    "N802",
    "N803",
    "N806",
    "N815",
    # warnings about mutable default values trigger too often
    "B006",
    # https://github.com/globality-corp/flake8-logging-format/issues/49
    "G004",
    # using a result variable instead of early return allows later addition of logic
    "RET504",
    # elif/else after return/raise/continue/break is not necessary but can be easier to read
    "RET505",
    "RET506",
    "RET507",
    "RET508",
    # no warnings about assert
    "B011",
    "S101",
    # no warnings about pickle,
    "S301",
    "S403",
    # no warnings about XML parsing
    "S318",
    "S405",
    "S408",
    # no warnings about all uses of subprocess
    "S404",
    "S603",
    "S607",
    # several scripts use print() for their output, so allow it
    "T201",
    "T203",
    #
    "B904",
    "B905",
    "N999",
    "RET503",
    "S113",
]

[tool.ruff.lint.per-file-ignores]
"bin/*" = [
    # imports need to come after sys.path changes
    "E402",
]
"benchexec/containerexecutor.py" = [
    # references to /tmp are for other reasons
    "S108",
]
"benchexec/test*.py" = [
    # wildcard imports significantly shorten test code,
    "F405",
    # accessing /tmp is ok
    "S108",
]
"benchexec/tools/*.py" = [
    # Tool-info modules are not garbage-collected anyway, caching is ok
    "B019",
]
"contrib/create_yaml_files.py" = [
    # should be refactored completely first (everything in functions)
    "B023",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
python_files = ["test_*.py", "test_integration/__init__.py", "test.py"]
norecursedirs = ["contrib/p4/docker_files", "build", "benchexec/tablegenerator/react-table"]
