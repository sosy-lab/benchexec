name: Table-generator tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-table-generator:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && format('registry.gitlab.com/sosy-lab/software/benchexec/test:python-{0}', matrix.python-version) || '' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Run table-generator tests
        run: python -m pytest benchexec/tablegenerator/